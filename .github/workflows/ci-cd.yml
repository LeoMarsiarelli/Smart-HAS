name: CI/CD — Smart HAS Backend + Oracle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # 1) Build & testes automatizados
  # ---------------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run automated tests
        run: mvn -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/backend-*.jar
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## Build & Test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes: ver artifact \`surefire-reports\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- JAR publicado como artifact \`backend-jar\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 2) Integração real com Oracle: deploy dos scripts PL/SQL (schema,
  #    seed, package, triggers) contra um Oracle XE de verdade subido
  #    como serviço do job, e execução dos exemplos de uso como teste
  #    de integração.
  # ---------------------------------------------------------------------
  oracle-integration:
    name: Oracle PL/SQL Integration
    runs-on: ubuntu-latest
    needs: build-test
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: SmartHas123
          ORACLE_DATABASE: SMARTHAS
          APP_USER: smarthas
          APP_USER_PASSWORD: SmartHas123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Oracle to accept connections
        run: |
          CID=$(docker ps -qf "ancestor=gvenzl/oracle-xe:21-slim")
          echo "Oracle container: $CID"
          for i in $(seq 1 60); do
            if docker exec "$CID" bash -c "printf 'set heading off\nset feedback off\nset verify off\nselect 1 from dual;\n' | sqlplus -s smarthas/SmartHas123@//localhost:1521/SMARTHAS" 2>/dev/null | tr -d '[:space:]' | grep -q "^1$"; then
              echo "Oracle ready after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Oracle did not become ready in time" >&2
          docker logs "$CID" --tail 100
          exit 1

      - name: Deploy PL/SQL objects (schema, seed, package, triggers)
        run: |
          CID=$(docker ps -qf "ancestor=gvenzl/oracle-xe:21-slim")
          set -e
          for f in 01_schema.sql 02_seed_data.sql 03_package_smarthas.sql 04_triggers.sql; do
            echo "::group::Running $f"
            docker cp "database/$f" "$CID:/tmp/$f"
            docker exec "$CID" bash -c "sqlplus -s smarthas/SmartHas123@//localhost:1521/SMARTHAS @/tmp/$f"
            echo "::endgroup::"
          done

      - name: Run integration examples (functions, procedures, triggers, dynamic SQL)
        run: |
          CID=$(docker ps -qf "ancestor=gvenzl/oracle-xe:21-slim")
          docker cp "database/05_usage_examples.sql" "$CID:/tmp/05_usage_examples.sql"
          docker exec "$CID" bash -c "sqlplus -s smarthas/SmartHas123@//localhost:1521/SMARTHAS @/tmp/05_usage_examples.sql" | tee oracle-integration.log

      - name: Fail if any uncaught Oracle/SQL*Plus error leaked into the log
        run: |
          # Linhas que começam com ORA-/PLS-/SP2- indicam erro não tratado do
          # sqlplus ou do compilador PL/SQL. O único ORA- esperado no log
          # está embutido dentro de uma mensagem de DBMS_OUTPUT (não começa
          # a linha), referente à exceção tratada de propósito no exemplo 7.
          if grep -En "^(ORA-|PLS-|SP2-)" oracle-integration.log; then
            echo "Unexpected uncaught error found in integration log" >&2
            exit 1
          fi
          echo "No unexpected Oracle errors — package, triggers and dynamic SQL ran clean."

      - name: Publish Oracle integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-integration-log
          path: oracle-integration.log
          retention-days: 14

      - name: Integration summary
        if: always()
        run: |
          echo "## Oracle PL/SQL Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "Schema + seed + SMARTHAS_PKG (package) + triggers de auditoria implantados em um Oracle XE 21c real, e \`05_usage_examples.sql\` executado como teste de integração (functions em SELECT, procedures, triggers disparando, Dynamic SQL)." >> "$GITHUB_STEP_SUMMARY"
          echo "Log completo: artifact \`oracle-integration-log\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 3) Deploy automatizado: build da imagem Docker do backend e publicação
  #    versionada no GitHub Container Registry.
  # ---------------------------------------------------------------------
  deploy:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    needs: [build-test, oracle-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image repository
        id: vars
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/smart-has-backend:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/smart-has-backend:${{ github.sha }}

      - name: Deploy summary
        run: |
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem publicada: \`ghcr.io/${{ steps.vars.outputs.owner_lc }}/smart-has-backend:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Integração com o Oracle validada no job \`oracle-integration\` antes do deploy." >> "$GITHUB_STEP_SUMMARY"
