server:
  port: 8080

spring:
  application:
    name: smart-has-backend
  datasource:
    url: jdbc:h2:file:./data/smarthas;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

smarthas:
  jwt:
    # Chave usada apenas em desenvolvimento. Em produção, defina via variável de
    # ambiente SMARTHAS_JWT_SECRET com um valor forte e secreto (>= 256 bits).
    secret: ${SMARTHAS_JWT_SECRET:smart-has-dev-secret-key-change-me-please-32bytes-min}
    expiration-ms: 86400000 # 24h
  oracle:
    # Camada de inteligência Oracle (Fase 6): desativada por padrão. Ative com
    # --spring.profiles.active=oracle (ver application-oracle.yml). Datasource
    # independente do usado pelo JPA — não substitui H2/Postgres nesta fase.
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
