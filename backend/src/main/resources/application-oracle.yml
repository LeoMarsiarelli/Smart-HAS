# Fase 6 — ativa a camada de inteligência Oracle (PL/SQL) além do datasource
# principal (H2/Postgres, que continua servindo o JPA normalmente).
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=oracle
# (combine com -Dspring-boot.run.profiles=postgres,oracle se quiser os dois)
smarthas:
  oracle:
    enabled: true
    url: ${SMARTHAS_ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/SMARTHAS}
    username: ${SMARTHAS_ORACLE_USER:smarthas}
    password: ${SMARTHAS_ORACLE_PASSWORD:SmartHas123}
